const TOTAL = DATA.reduce((s,r)=>s+r.pr,0);
document.getElementById("stats").textContent = `${DATA.length} cards · $${TOTAL.toFixed(2)} total value`;
let activeFilter = "";
const list = document.getElementById("list"), chips = document.getElementById("chips");
function renderChips(){
  chips.innerHTML = "";
  const mk = (label, pred) => {
    const n = DATA.filter(pred).length;
    const b = document.createElement("button");
    b.className = "chip" + (activeFilter === label ? " on" : "");
    b.textContent = `${label} (${n})`;
    b.onclick = () => { activeFilter = (activeFilter === label) ? "" : label; renderChips(); render(); };
    chips.appendChild(b);
  };
  mk("All", () => true);
  mk("Rookies", r => r.rc);
  mk("Inserts", r => r.style.split(" ").length > 4);
}
function passesFilter(r){
  if (activeFilter === "Rookies") return r.rc;
  if (activeFilter === "Inserts") return r.style.split(" ").length > 4;
  return true;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase();
  list.innerHTML = "";
  for (const r of DATA){
    if (!passesFilter(r)) continue;
    if (q && !((r.p + " " + r.team).toLowerCase().includes(q))) continue;
    const el = document.createElement("div");
    el.className = "card";
    const badges = (r.rc?'<span class="badge b-rc">RC</span>':'');
    el.innerHTML = (r.img ? `<img class="th" loading="lazy" src="${r.img}">` : `<div class="th"></div>`) +
      `<div class="info"><div class="nm">${badges}${r.p}</div><div class="tm">${r.team}</div><div class="st">${r.style}</div></div>` +
      `<div class="pr">$${r.pr.toFixed(2)}</div>`;
    const img = el.querySelector("img.th");
    if (img) img.onclick = () => { document.getElementById("lbimg").src = r.img; document.getElementById("lightbox").classList.add("on"); };
    list.appendChild(el);
  }
}
document.getElementById("lightbox").onclick = () => document.getElementById("lightbox").classList.remove("on");
document.getElementById("q").oninput = render;
renderChips(); render();
