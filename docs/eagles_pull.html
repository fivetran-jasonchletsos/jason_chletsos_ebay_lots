const LOTS = [{"id": 1, "name": "Eagles Lot 1", "count": 25, "color": "#004C54"}, {"id": 2, "name": "Eagles Lot 2", "count": 26, "color": "#A5ACAF"}, {"id": 3, "name": "Eagles Lot 3", "count": 26, "color": "#000000"}, {"id": 4, "name": "Eagles Lot 4", "count": 26, "color": "#004C54"}, {"id": 5, "name": "Eagles Lot 5", "count": 26, "color": "#A5ACAF"}, {"id": 6, "name": "Eagles Lot 6", "count": 22, "color": "#000000"}];
const KEY = "eagles_pull";
let done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let activeLot = null;
const list = document.getElementById("list"), chips = document.getElementById("chips");
function renderChips(){
  chips.innerHTML = "";
  const mkChip = (id, label, color, count) => {
    const b = document.createElement("button");
    b.className = "chip" + (activeLot === id ? " on" : "");
    if (activeLot === id) b.style.background = color;
    b.textContent = count != null ? `${label} (${count})` : label;
    b.onclick = () => { activeLot = (activeLot === id) ? null : id; renderChips(); render(); };
    chips.appendChild(b);
  };
  mkChip(null, "All", "#004C54", DATA.length);
  for (const lot of LOTS) mkChip(lot.id, lot.name, lot.color, lot.count);
}
function render(){
  list.innerHTML = "";
  const rows = activeLot === null ? DATA : DATA.filter(r => r.lot === activeLot);
  document.getElementById("stats").textContent = `${rows.length} card${rows.length===1?'':'s'}` +
    (activeLot === null ? " (grouped by lot, A-Z within each)" : " (A-Z)");
  let curLot = null;
  for (const r of rows){
    if (activeLot === null && r.lot !== curLot) {
      curLot = r.lot;
      const lotInfo = LOTS.find(l => l.id === curLot);
      const h = document.createElement("div");
      h.style.cssText = `font-size:13px;font-weight:700;color:#fff;background:${lotInfo.color};padding:6px 10px;border-radius:8px;margin:14px 0 6px`;
      h.textContent = `${lotInfo.name}`;
      list.appendChild(h);
    }
    const el = document.createElement("div");
    el.className = "card" + (done.has(r.k) ? " done" : "");
    const lotInfo = LOTS.find(l => l.id === r.lot);
    el.innerHTML = `<div class="box"></div>` +
      (r.img ? `<img class="th" loading="lazy" src="${r.img}">` : `<div class="th"></div>`) +
      `<div class="info"><div class="nm">${r.p}</div></div>` +
      (activeLot === null ? `<div class="lotpill" style="background:${lotInfo.color}">Lot ${r.lot}</div>` : '');
    const img = el.querySelector("img.th");
    if (img) img.onclick = (e) => { e.stopPropagation(); document.getElementById("lbimg").src = r.img;
      document.getElementById("lightbox").classList.add("on"); };
    el.onclick = () => { done.has(r.k) ? done.delete(r.k) : done.add(r.k);
      localStorage.setItem(KEY, JSON.stringify([...done])); render(); };
    list.appendChild(el);
  }
  document.getElementById("cnt").textContent = `${done.size} / ${DATA.length} pulled`;
}
document.getElementById("lightbox").onclick = () => document.getElementById("lightbox").classList.remove("on");
document.getElementById("rep").onclick = async (e) => {
  e.stopPropagation();
  const scope = activeLot === null ? "ALL" : `LOT ${activeLot}`;
  const rows = activeLot === null ? DATA : DATA.filter(r => r.lot === activeLot);
  const doneInScope = rows.filter(r => done.has(r.k)).length;
  const txt = `EAGLES PULL (${scope}): ${doneInScope}/${rows.length} pulled.`;
  try { await navigator.clipboard.writeText(txt); e.target.textContent = "Copied!";
        setTimeout(()=>e.target.textContent="Copy report", 1500); }
  catch { prompt("Copy this:", txt); }
};
