<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>2026 Topps Chrome BB pull list</title>
<style>
 body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#f4f6f9;color:#111}
 .wrap{max-width:760px;margin:0 auto;padding:16px 14px 80px}
 h1{font-size:22px;margin:6px 0 2px}
 .sub{color:#667;font-size:13.5px;margin:0 0 10px;line-height:1.4}
 .card{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dde;border-radius:12px;
       padding:9px 11px;margin:6px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
 .card.done{opacity:.45;background:#e8f5e9;border-color:#9c9}
 .card.done .nm{text-decoration:line-through}
 .box{flex:0 0 26px;height:26px;border:2.5px solid #345;border-radius:7px}
 .card.done .box{background:#1a7f1a;border-color:#1a7f1a}
 img.th{width:48px;height:64px;object-fit:cover;border-radius:6px;background:#eee;flex:0 0 48px;cursor:zoom-in}
 .info{flex:1;min-width:0}
 .nm{font-weight:650;font-size:14.5px;line-height:1.25}
 .tm{color:#99a;font-size:11px}
 .badge{display:inline-block;font-size:9.5px;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:4px;vertical-align:1px}
 .b-ser{background:#7a2e8f;color:#fff}
 .pr{flex:0 0 auto;font-weight:700;color:#1a5c1a;font-size:14px}
 #bar{position:fixed;bottom:0;left:0;right:0;background:#123;color:#fff;text-align:center;padding:11px;font-size:15px;font-weight:600}
 #reset{float:right;background:none;border:1px solid #789;color:#bcd;border-radius:8px;padding:3px 9px;font-size:12px;margin-right:8px}
 #rep{float:right;background:#d4af37;border:none;color:#123;border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700;margin-right:8px}
 #lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;align-items:center;justify-content:center}
 #lightbox.on{display:flex}
 #lightbox img{max-width:92vw;max-height:88vh;border-radius:10px}
</style></head><body><div class="wrap">
<h1>2026 Topps Chrome BB pull list</h1>
<p class="sub">The cards worth pulling and posting individually ($5+ or serial-numbered). Everything else goes to lot fodder. Tap the row to mark pulled, tap the image to zoom.</p>
<div id="list"></div>
</div>
<div id="lightbox"><img id="lbimg" src=""></div>
<div id="bar"><button id="reset">reset</button><button id="rep">Copy report</button><span id="cnt"></span></div>
<script>
const DATA = [{"k": "866_08", "p": "Parker Messick", "team": "Cleveland Guardians", "pr": 16.25, "rc": true, "auto": false, "serial": "09/99", "style": "2026 Topps Chrome Green Refractor 09/99", "img": "tc26_bb_imgs/866_08.jpg"}, {"k": "866_03", "p": "Aaron Judge", "team": "New York Yankees", "pr": 15.07, "rc": false, "auto": false, "serial": null, "style": "2026 Topps Chrome Wrecking Crew", "img": "tc26_bb_imgs/866_03.jpg"}, {"k": "865_06", "p": "Yordan Alvarez", "team": "Houston Astros", "pr": 12.64, "rc": false, "auto": false, "serial": null, "style": "2026 Topps Chrome", "img": "tc26_bb_imgs/865_06.jpg"}, {"k": "865_07", "p": "JJ Wetherholt", "team": "St. Louis Cardinals", "pr": 10.23, "rc": true, "auto": false, "serial": null, "style": "2026 Topps Chrome Future Stars", "img": "tc26_bb_imgs/865_07.jpg"}, {"k": "868_02", "p": "Luis Robert Jr.", "team": "New York Mets", "pr": 8.0, "rc": false, "auto": false, "serial": null, "style": "2026 Topps Chrome X-Fractor", "img": "tc26_bb_imgs/868_02.jpg"}, {"k": "865_01", "p": "Shohei Ohtani", "team": "Los Angeles Dodgers", "pr": 6.26, "rc": false, "auto": false, "serial": null, "style": "2026 Topps Chrome Big Ticket Player", "img": "tc26_bb_imgs/865_01.jpg"}, {"k": "865_02", "p": "Hunter Brown", "team": "Houston Astros", "pr": 5.0, "rc": false, "auto": false, "serial": null, "style": "2026 Topps Chrome X-Fractor", "img": "tc26_bb_imgs/865_02.jpg"}];
const KEY = "tc26bb_pull";
let done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
const list = document.getElementById("list");
function render(){
  list.innerHTML = "";
  for (const r of DATA){
    const el = document.createElement("div");
    el.className = "card" + (done.has(r.k) ? " done" : "");
    const badges = (r.serial?`<span class="badge b-ser">${r.serial}</span>`:'');
    el.innerHTML = `<div class="box"></div>` +
      (r.img ? `<img class="th" loading="lazy" src="${r.img}">` : `<div class="th"></div>`) +
      `<div class="info"><div class="nm">${badges}${r.p}</div><div class="tm">${r.team}</div></div>` +
      `<div class="pr">$${r.pr.toFixed(2)}</div>`;
    const img = el.querySelector("img.th");
    if (img) img.onclick = (e) => { e.stopPropagation(); document.getElementById("lbimg").src = r.img;
      document.getElementById("lightbox").classList.add("on"); };
    el.onclick = () => { done.has(r.k) ? done.delete(r.k) : done.add(r.k);
      localStorage.setItem(KEY, JSON.stringify([...done])); render(); };
    list.appendChild(el);
  }
  document.getElementById("cnt").textContent = `${done.size} / ${DATA.length} pulled`;
}
document.getElementById("lightbox").onclick = () => document.getElementById("lightbox").classList.remove("on");
document.getElementById("rep").onclick = async (e) => {
  e.stopPropagation();
  const txt = `TOPPS CHROME BB PULL: ${done.size}/${DATA.length} pulled. ` + DATA.map(r => `${r.p} $${r.pr.toFixed(2)}`).join(" | ");
  try { await navigator.clipboard.writeText(txt); e.target.textContent = "Copied!";
        setTimeout(()=>e.target.textContent="Copy report", 1500); }
  catch { prompt("Copy this:", txt); }
};
document.getElementById("reset").onclick = (e)=>{e.stopPropagation(); if(confirm("Clear all checkmarks?")){done.clear();localStorage.removeItem(KEY);render();}};
render();
</script></body></html>
