const ENDPOINT = "https://jw0hur2091.execute-api.us-east-1.amazonaws.com/ebay/mike/request";
let sel = new Set();
const list = document.getElementById("list");
function render(){
  const q = document.getElementById("q").value.toLowerCase();
  list.innerHTML = "";
  for (const r of DATA){
    if (q && !((r.p + " " + r.k).toLowerCase().includes(q))) continue;
    const el = document.createElement("div");
    el.className = "card" + (sel.has(r.k) ? " sel" : "");
    el.innerHTML = `<div class="box"></div>` +
      (r.img ? `<img class="th" loading="lazy" src="${r.img}">` : `<div class="th"></div>`) +
      `<div class="info"><div class="nm">${r.p}</div><div class="id"><a href="${r.url || ('https://www.ebay.com/itm/' + r.k)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:#36c;text-decoration:none;font-weight:600">${r.k} &#8599; view on eBay</a></div></div>` +
      `<div class="pr">$${r.pr.toFixed(2)}</div>`;
    el.onclick = () => { sel.has(r.k) ? sel.delete(r.k) : sel.add(r.k); render(); };
    list.appendChild(el);
  }
  const total = DATA.filter(r => sel.has(r.k)).reduce((s,r)=>s+r.pr,0);
  document.getElementById("cnt").textContent = sel.size ? `${sel.size} selected · $${total.toFixed(2)} value` : `${DATA.length} cards available`;
  const btn = document.getElementById("submit");
  btn.disabled = sel.size === 0;
  btn.textContent = sel.size ? `Request ${sel.size} card${sel.size>1?'s':''}` : "Request 0 cards";
}
document.getElementById("q").oninput = render;
document.getElementById("submit").onclick = async () => {
  const btn = document.getElementById("submit");
  btn.disabled = true; btn.textContent = "Sending...";
  try {
    const r = await fetch(ENDPOINT, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({item_ids: [...sel], note: document.getElementById("note").value})
    });
    const j = await r.json();
    if (j.success) {
      const t = document.createElement("div");
      t.className = "toast";
      t.textContent = `Sent to JC! Request #${j.request_id}, ${j.count} card(s).`;
      document.body.appendChild(t);
      setTimeout(()=>t.remove(), 4000);
      sel.clear(); document.getElementById("note").value = "";
    } else {
      alert("Something went wrong: " + (j.error || "unknown error"));
    }
  } catch (e) {
    alert("Couldn't reach JC's server. Try again in a bit, or just text him: " + e.message);
  }
  render();
};
render();
