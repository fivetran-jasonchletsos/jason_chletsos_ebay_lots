<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Mike's Kids Scanner — Under Maintenance</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0a0a12;
    color: #f2f2f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background-image: radial-gradient(ellipse 900px 700px at 50% -10%, rgba(90,100,220,0.25), transparent 60%);
  }
  .card {
    max-width: 460px;
    text-align: center;
    background: #14142a;
    border: 1px solid #2a2a4a;
    border-radius: 16px;
    padding: 40px 32px;
  }
  .icon { font-size: 40px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin-bottom: 10px; color: #fff; }
  p { font-size: 15px; color: #9797b8; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">&#9888;</div>
    <h1>Mike's Kids Scanner is under maintenance</h1>
    <p>This scanner is temporarily offline. Check back later.</p>
  </div>
</body>
</html>
