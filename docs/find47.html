let done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
const list = document.getElementById("list");
function render(){
  const q = document.getElementById("q").value.toLowerCase();
  list.innerHTML = "";
  for (const r of DATA){
    const hay = (r.p + " " + r.d + " " + r.s).toLowerCase();
    if (q && !hay.includes(q)) continue;
    const el = document.createElement("div");
    el.className = "card" + (done.has(r.k) ? " done" : "");
    el.innerHTML = `<div class="box"></div><div class="info"><div class="nm">${r.p}</div>` +
      `<div class="ds">${r.d}</div></div><div class="prc">~$${r.t}</div>` +
      `<div class="loc"><b>${r.s}</b><span>pos ${r.o}</span></div>`;

      localStorage.setItem(KEY, JSON.stringify([...done])); render(); };
    list.appendChild(el);
  }
  document.getElementById("cnt").textContent = `${done.size} / ${DATA.length} pulled`;
}
document.getElementById("q").oninput = render;
document.getElementById("reset").onclick = (e)=>{e.stopPropagation(); if(confirm("Clear all checkmarks?")){done.clear();localStorage.removeItem(KEY);render();}};
