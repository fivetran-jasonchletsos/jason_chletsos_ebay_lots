<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Free Will Cards — The Collection</title>
<meta name="description" content="Football and baseball cards, scanned and priced for the shop floor at Free Will.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d; --surface:#141417; --surface-2:#1b1b20; --surface-3:#232329;
    --gold:#c9a24b; --gold-2:#d4af37; --gold-dim:rgba(201,162,75,.16);
    --text:#f5f5f2; --muted:#b7b4ab; --dim:#7d7a72;
    --border:rgba(201,162,75,.22); --border-soft:rgba(245,245,242,.08);
    --success:#6cba7f;
    --r-sm:6px; --r-md:10px; --r-lg:16px;
    --font-head:'Oswald',system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,sans-serif;
    --t:220ms cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(201,162,75,.12), transparent 55%),
      radial-gradient(90% 60% at 100% 100%, rgba(201,162,75,.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    font-size:16px; line-height:1.55; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .top-rule{height:3px;background:linear-gradient(90deg,transparent,var(--gold) 50%,transparent)}

  header{
    text-align:center; padding:38px 20px 26px; position:relative; overflow:hidden;
    border-bottom:1px solid var(--border-soft);
  }
  .wordmark{
    font-family:var(--font-head); font-weight:700; text-transform:uppercase;
    font-size:clamp(26px,6.5vw,46px); letter-spacing:.14em; line-height:1.05;
    color:var(--text);
  }
  .wordmark .amp{color:var(--gold-2)}
  .tagline{
    font-family:var(--font-head); font-weight:500; text-transform:uppercase;
    color:var(--gold); font-size:clamp(10px,2.6vw,13px); letter-spacing:.34em; margin-top:14px;
  }
  .blurb{color:var(--muted); font-size:14.5px; max-width:34em; margin:16px auto 0}
  .scan-cta{
    display:inline-block; margin-top:22px; font-family:var(--font-head); font-weight:600;
    text-transform:uppercase; letter-spacing:.14em; font-size:12.5px; color:#141414;
    background:var(--gold); border-radius:999px; padding:11px 22px; text-decoration:none;
    transition:all var(--t);
  }
  .scan-cta:hover{background:var(--gold-2); transform:translateY(-2px)}

  nav.cats{
    position:sticky; top:0; z-index:40;
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    padding:14px 16px; background:rgba(11,11,13,.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
  }
  .cat{
    font-family:var(--font-head); font-weight:500; text-transform:uppercase;
    font-size:12px; letter-spacing:.12em; color:var(--muted);
    background:var(--surface-2); border:1.5px solid var(--border-soft);
    border-radius:999px; padding:9px 16px; cursor:pointer; transition:all var(--t);
    white-space:nowrap;
  }
  .cat:hover{border-color:var(--border); color:var(--text)}
  .cat.active{background:var(--gold); border-color:var(--gold); color:#141414; font-weight:600}
  .cat:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

  main{max-width:1100px; margin:0 auto; padding:26px 16px 10px}
  .count-row{color:var(--dim); font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; margin:0 2px 16px; font-family:var(--font-head)}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr); gap:18px}}

  .card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--r-lg);
    overflow:hidden; display:flex; flex-direction:column;
    transition:transform var(--t),box-shadow var(--t),border-color var(--t);
    animation:rise .5s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media(hover:hover){.card:hover{transform:translateY(-5px); border-color:var(--border); box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 0 1px var(--gold-dim)}}

  .thumb{position:relative; aspect-ratio:3/4; overflow:hidden; background:var(--surface-2)}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .ph{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background:
      repeating-linear-gradient(45deg, rgba(201,162,75,.04) 0 10px, transparent 10px 20px),
      radial-gradient(80% 60% at 50% 30%, rgba(201,162,75,.1), transparent 70%),
      var(--surface-2);
    color:var(--gold); text-align:center; padding:16px;
  }
  .ph svg{width:40px;height:40px;opacity:.7}
  .ph .pm{font-family:var(--font-head); font-weight:600; text-transform:uppercase; letter-spacing:.2em; font-size:10px; color:var(--gold)}
  .ph .pn{color:var(--dim); font-size:11px; letter-spacing:.14em; text-transform:uppercase}

  .tags{position:absolute; top:8px; left:8px; right:8px; display:flex; flex-wrap:wrap; gap:5px}
  .tag{
    font-family:var(--font-head); font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.08em;
    padding:3px 8px; border-radius:999px;
    background:rgba(201,162,75,.2); color:var(--gold-2); border:1px solid rgba(201,162,75,.4);
    backdrop-filter:blur(4px);
  }
  .sport-chip{
    position:absolute; top:8px; right:8px; font-family:var(--font-head);
    font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.1em;
    padding:3px 9px; border-radius:999px;
    background:rgba(11,11,13,.7); color:var(--muted); border:1px solid var(--border-soft); backdrop-filter:blur(4px);
  }

  .info{padding:14px 15px 16px; display:flex; flex-direction:column; gap:4px; flex:1}
  .set{font-family:var(--font-head); font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:.16em; color:var(--gold)}
  .name{font-family:var(--font-head); font-weight:600; font-size:17px; line-height:1.2; color:var(--text)}
  .meta{color:var(--muted); font-size:12.5px; line-height:1.45; margin-top:2px}
  .price{margin-top:auto; padding-top:10px; font-family:var(--font-head); font-weight:700; font-size:19px; color:var(--gold-2)}

  .empty{text-align:center; padding:70px 20px; color:var(--dim); font-family:var(--font-head); text-transform:uppercase; letter-spacing:.18em; font-size:14px}
  .empty.hidden{display:none}
  .empty a{color:var(--gold); text-decoration:none; border-bottom:1px solid var(--border)}

  footer{
    margin-top:46px; border-top:1px solid var(--border-soft);
    background:linear-gradient(180deg,transparent,var(--surface) 120%);
    text-align:center; padding:34px 20px 44px;
  }
  footer .fm{font-family:var(--font-head); font-weight:600; text-transform:uppercase; letter-spacing:.24em; color:var(--gold); font-size:13px}
  footer .fc{color:var(--muted); font-size:14px; margin-top:12px; line-height:1.9}
  footer .scan-link{display:inline-block; margin-top:22px; font-family:var(--font-head); font-size:12px; text-transform:uppercase; letter-spacing:.14em; color:var(--dim); text-decoration:none}
  footer .scan-link:hover{color:var(--gold)}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="top-rule"></div>

<header>
  <div class="wordmark">Free Will <span class="amp">Cards</span></div>
  <div class="tagline">Football &middot; Baseball &middot; Scanned In-Store</div>
  <p class="blurb">Every card in the case, photographed and priced on the spot. Come find your guy.</p>
  <a class="scan-cta" href="scanner.html">Staff: scan a card &rarr;</a>
</header>

<nav class="cats" id="cats" aria-label="Sport filter"></nav>

<main>
  <div class="count-row" id="countRow"></div>
  <div class="grid" id="grid"></div>
  <div class="empty hidden" id="empty">No cards yet &mdash; <a href="scanner.html">scan the first one &rarr;</a></div>
</main>

<footer>
  <div class="fm">Free Will Cards</div>
  <div class="fc">
    Football &amp; baseball singles &middot; priced to move
  </div>
  <a class="scan-link" href="scanner.html">Staff: scan a card &rarr;</a>
</footer>

<script>
let CARDS = [];
let SPORTS = ['All'];
let activeCat = 'All';

function sportOf(c){
  const s = String(c.sport||'').trim().toLowerCase();
  if(!s) return 'Other';
  if(s.includes('foot')) return 'Football';
  if(s.includes('base')) return 'Baseball';
  if(s.includes('basket')) return 'Basketball';
  if(s.includes('hock')) return 'Hockey';
  if(s.includes('soccer')||s.includes('futbol')) return 'Soccer';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function money(n){
  if(typeof n!=='number' || !isFinite(n) || n<=0) return '';
  return '$' + n.toLocaleString(undefined,{minimumFractionDigits: n%1?2:0, maximumFractionDigits:2});
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const PH_SVG = '<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="2.2" stroke="currentColor" stroke-width="1.5"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';

function renderCats(){
  const nav = document.getElementById('cats');
  nav.innerHTML = '';
  SPORTS.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'cat' + (c===activeCat?' active':'');
    b.textContent = c;
    b.setAttribute('aria-pressed', c===activeCat);
    b.onclick = ()=>{ activeCat = c; renderCats(); renderGrid(); };
    nav.appendChild(b);
  });
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const countRow = document.getElementById('countRow');
  const list = activeCat==='All' ? CARDS : CARDS.filter(c=>sportOf(c)===activeCat);

  grid.innerHTML = '';
  if(!list.length){
    empty.classList.remove('hidden');
    countRow.textContent = '';
    return;
  }
  empty.classList.add('hidden');
  countRow.textContent = list.length + (list.length===1?' card':' cards') + (activeCat==='All'?'':' · ' + activeCat);

  list.forEach((c,i)=>{
    const el = document.createElement('article');
    el.className = 'card';
    el.style.animationDelay = Math.min(i*30,420) + 'ms';

    const hasImg = c.image && String(c.image).trim() !== '';
    const thumb = hasImg
      ? '<img src="'+esc(c.image)+'" alt="'+esc(c.name||'Card')+'" loading="lazy">'
      : '<div class="ph">'+PH_SVG+'<div class="pm">'+esc(c.set||c.brand||'Free Will')+'</div><div class="pn">Photo coming soon</div></div>';

    const tags = [];
    if(c.isRookie) tags.push('RC');
    if(c.isAuto)   tags.push('Auto');
    if(c.isRelic)  tags.push('Relic');
    if(c.serial)   tags.push('#'+esc(c.serial));
    if(c.parallel) tags.push(esc(c.parallel));
    const tagHtml = tags.length ? '<div class="tags">'+tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>' : '';

    const sport = sportOf(c);
    const sportHtml = sport ? '<span class="sport-chip">'+esc(sport)+'</span>' : '';

    const metaBits = [c.team, c.cardNumber?('#'+esc(c.cardNumber)):''].filter(Boolean).join(' · ');

    el.innerHTML =
      '<div class="thumb">'+thumb+tagHtml+sportHtml+'</div>'+
      '<div class="info">'+
        (c.set?'<div class="set">'+esc(c.set)+'</div>':'')+
        '<div class="name">'+esc(c.name||'Unidentified card')+'</div>'+
        (metaBits?'<div class="meta">'+metaBits+'</div>':'')+
        '<div class="price">'+(money(c.estValue)||'Ask in store')+'</div>'+
      '</div>';
    grid.appendChild(el);
  });
}

function buildSports(){
  const seen = new Set();
  CARDS.forEach(c=>seen.add(sportOf(c)));
  const ordered = ['Football','Baseball'].filter(s=>seen.has(s));
  [...seen].sort().forEach(s=>{ if(!ordered.includes(s)) ordered.push(s); });
  SPORTS = ['All', ...ordered];
}

async function init(){
  try{
    const r = await fetch('./cards.json?t=' + Date.now());
    CARDS = await r.json();
    if(!Array.isArray(CARDS)) CARDS = [];
  }catch(e){
    CARDS = [];
  }
  CARDS.sort((a,b)=> (b.id||0) - (a.id||0));
  buildSports();
  renderCats();
  renderGrid();
}
init();
</script>
</body>
</html>
