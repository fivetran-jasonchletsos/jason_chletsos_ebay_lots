<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>2025 Topps Baseball (Scans 905-911) - Pull List</title>
<style>
 body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#f4f6f9;color:#111}
 .wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
 h1{font-size:22px;margin:6px 0 2px;color:#123}
 .sub{color:#667;font-size:13.5px;margin:0 0 10px;line-height:1.4}
 .card{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dde;border-radius:12px;
       padding:9px 11px;margin:6px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
 .card.done{opacity:.45;background:#e8f5e9;border-color:#9c9}
 .card.done .nm{text-decoration:line-through}
 .box{flex:0 0 26px;height:26px;border:2.5px solid #123;border-radius:7px}
 .card.done .box{background:#1a7f1a;border-color:#1a7f1a}
 img.th{width:52px;height:70px;object-fit:cover;border-radius:6px;background:#eee;flex:0 0 52px;cursor:zoom-in}
 .info{flex:1;min-width:0}
 .nm{font-weight:650;font-size:15px;line-height:1.25}
 .tm{color:#667;font-size:12px}
 .st{color:#99a;font-size:11px;margin-top:2px}
 .ser{display:inline-block;font-size:10px;font-weight:800;background:#c0392b;color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px}
 .auto{display:inline-block;font-size:10px;font-weight:800;background:#0a7c3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px}
 .pr{flex:0 0 auto;font-weight:700;color:#1a5c1a;font-size:16px}
 #bar{position:fixed;bottom:0;left:0;right:0;background:#123;color:#fff;text-align:center;padding:11px;font-size:15px;font-weight:600}
 #reset{float:right;background:none;border:1px solid #789;color:#bcd;border-radius:8px;padding:3px 9px;font-size:12px;margin-right:8px}
 #rep{float:right;background:#A5ACAF;border:none;color:#123;border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700;margin-right:8px}
 #lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;align-items:center;justify-content:center}
 #lightbox.on{display:flex}
 #lightbox img{max-width:92vw;max-height:88vh;border-radius:10px}
</style></head><body><div class="wrap">
<h1>2025 Topps Baseball (Scans 905-911) &mdash; Pull List</h1>
<p class="sub">1 card clears the $5 bar from this batch opened 2026-08-11. See the <a href="tc25_pricing.html">full reference</a> for everything else. Tap a card to check it off, tap the image to zoom.</p>
<div id="list"></div>
</div>
<div id="lightbox"><img id="lbimg" src=""></div>
<div id="bar"><button id="reset">reset</button><button id="rep">Copy report</button><span id="cnt"></span></div>
<script>
const DATA = [{"k": "905_04", "p": "Jackson Merrill", "team": "Padres", "pr": 17.8, "style": "2025 Topps All-Star Stars Gold", "serial": null, "auto": false, "img": "tc25_imgs/905_04.jpg"}];
const KEY = "tc25_pull";
let done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
const list = document.getElementById("list");
function render(){
  list.innerHTML = "";
  for (const r of DATA){
    const el = document.createElement("div");
    el.className = "card" + (done.has(r.k) ? " done" : "");
    el.innerHTML = `<div class="box"></div>` +
      (r.img ? `<img class="th" loading="lazy" src="${r.img}">` : `<div class="th"></div>`) +
      `<div class="info"><div class="nm">${r.p}${r.auto?'<span class="auto">AUTO</span>':''}${r.serial?`<span class="ser">${r.serial}</span>`:''}</div><div class="tm">${r.team}</div><div class="st">${r.style}</div></div>` +
      `<div class="pr">$${r.pr.toFixed(2)}</div>`;
    const img = el.querySelector("img.th");
    if (img) img.onclick = (e) => { e.stopPropagation(); document.getElementById("lbimg").src = r.img;
      document.getElementById("lightbox").classList.add("on"); };
    el.onclick = () => { done.has(r.k) ? done.delete(r.k) : done.add(r.k);
      localStorage.setItem(KEY, JSON.stringify([...done])); render(); };
    list.appendChild(el);
  }
  document.getElementById("cnt").textContent = `${done.size} / ${DATA.length} pulled`;
}
document.getElementById("lightbox").onclick = () => document.getElementById("lightbox").classList.remove("on");
document.getElementById("rep").onclick = async (e) => {
  e.stopPropagation();
  const txt = `TOPPS 2025 (SCANS 905-911) PULL: ${done.size}/${DATA.length} pulled.`;
  try { await navigator.clipboard.writeText(txt); e.target.textContent = "Copied!";
        setTimeout(()=>e.target.textContent="Copy report", 1500); }
  catch { prompt("Copy this:", txt); }
};
document.getElementById("reset").onclick = ()=>{if(confirm("Clear all checkmarks?")){done.clear();localStorage.removeItem(KEY);render();}};
render();
</script></body></html>
