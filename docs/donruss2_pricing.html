<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>2025 Donruss Baseball (Batch 2) - Valuation Reference</title>
<style>
 body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#f4f6f9;color:#111}
 .wrap{max-width:820px;margin:0 auto;padding:16px 14px 40px}
 h1{font-size:22px;margin:6px 0 2px}
 .sub{color:#667;font-size:13.5px;margin:0 0 10px;line-height:1.4}
 #chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
 .chip{flex:0 0 auto;font-size:13px;font-weight:600;padding:7px 12px;border-radius:20px;border:1.5px solid #bcd;
       background:#fff;color:#345;cursor:pointer;white-space:nowrap}
 .chip.on{background:#123;color:#fff;border-color:#123}
 #q{width:100%;box-sizing:border-box;font-size:17px;padding:11px 13px;border:1px solid #ccd;border-radius:12px;margin:8px 0 10px}
 .card{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dde;border-radius:12px;
       padding:9px 11px;margin:6px 0}
 img.th{width:48px;height:64px;object-fit:cover;border-radius:6px;background:#eee;flex:0 0 48px;cursor:zoom-in}
 .info{flex:1;min-width:0}
 .nm{font-weight:650;font-size:14.5px;line-height:1.25}
 .tm{color:#667;font-size:12px}
 .st{color:#99a;font-size:11px;margin-top:2px}
 .badge{display:inline-block;font-size:9.5px;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:4px;vertical-align:1px}
 .b-rc{background:#123;color:#fff}
 .b-leg{background:#7a2e8f;color:#fff}
 .pr{flex:0 0 auto;font-weight:700;color:#1a5c1a;font-size:15px}
 #stats{position:sticky;top:0;background:#f4f6f9;padding:6px 0;font-size:12.5px;color:#556;border-bottom:1px solid #dde;margin-bottom:6px}
 #lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;align-items:center;justify-content:center}
 #lightbox.on{display:flex}
 #lightbox img{max-width:92vw;max-height:88vh;border-radius:10px}
</style></head><body><div class="wrap">
<h1>2025 Donruss Baseball (Batch 2)</h1>
<p class="sub">21 cards from packs opened 2026-08-10, priced against real PriceCharting comps. Mix of legends and current rookies/prospects, but nothing clears $5 (top is $3.00, Aaron Judge) &mdash; whole batch is lot fodder. Tap image to zoom.</p>
<div id="stats"></div>
<div id="chips"></div>
<input id="q" type="search" placeholder="Search player, team...">
<div id="list"></div>
</div>
<div id="lightbox"><img id="lbimg" src=""></div>
<script>
const DATA = [{"k": "887_02", "p": "Aaron Judge", "team": "Yankees", "pr": 3.0, "rc": false, "legend": false, "style": "Donruss", "img": "donruss2_imgs/887_02.jpg"}, {"k": "887_03", "p": "Miguel Cabrera", "team": "Tigers", "pr": 2.0, "rc": false, "legend": true, "style": "Donruss", "img": "donruss2_imgs/887_03.jpg"}, {"k": "888_03", "p": "Tony Lazzeri", "team": "Yankees", "pr": 2.0, "rc": false, "legend": true, "style": "Donruss Optic Orange Refractor", "img": "donruss2_imgs/888_03.jpg"}, {"k": "889_01", "p": "Wandy Asigen", "team": "Mets", "pr": 1.99, "rc": true, "legend": false, "style": "Donruss", "img": "donruss2_imgs/889_01.jpg"}, {"k": "888_08", "p": "Bubba Chandler", "team": "Pirates", "pr": 1.95, "rc": true, "legend": false, "style": "Donruss Elite Series", "img": "donruss2_imgs/888_08.jpg"}, {"k": "887_06", "p": "Jacob Misiorowski", "team": "Brewers", "pr": 1.79, "rc": true, "legend": false, "style": "Donruss", "img": "donruss2_imgs/887_06.jpg"}, {"k": "887_07", "p": "Hye-Seong Kim", "team": "Dodgers", "pr": 1.72, "rc": false, "legend": false, "style": "Donruss", "img": "donruss2_imgs/887_07.jpg"}, {"k": "887_01", "p": "Don Mattingly", "team": "Yankees", "pr": 1.54, "rc": false, "legend": true, "style": "Donruss", "img": "donruss2_imgs/887_01.jpg"}, {"k": "888_04", "p": "Leo Durocher", "team": "Cubs", "pr": 1.52, "rc": false, "legend": true, "style": "Donruss", "img": "donruss2_imgs/888_04.jpg"}, {"k": "889_02", "p": "Marek Houston", "team": "Twins", "pr": 1.5, "rc": true, "legend": false, "style": "Donruss", "img": "donruss2_imgs/889_02.jpg"}, {"k": "888_01", "p": "Rickey Henderson", "team": "Athletics", "pr": 1.5, "rc": false, "legend": true, "style": "Donruss", "img": "donruss2_imgs/888_01.jpg"}, {"k": "888_05", "p": "Slade Caldwell", "team": "Diamondbacks", "pr": 1.5, "rc": true, "legend": false, "style": "Donruss", "img": "donruss2_imgs/888_05.jpg"}, {"k": "888_06", "p": "Cade Horton", "team": "Cubs", "pr": 1.5, "rc": true, "legend": false, "style": "Donruss Optic", "img": "donruss2_imgs/888_06.jpg"}, {"k": "887_09", "p": "Payton Tolle", "team": "Red Sox", "pr": 1.49, "rc": true, "legend": false, "style": "Donruss", "img": "donruss2_imgs/887_09.jpg"}, {"k": "889_03", "p": "Chipper Jones", "team": "Braves", "pr": 1.22, "rc": false, "legend": true, "style": "Donruss", "img": "donruss2_imgs/889_03.jpg"}, {"k": "888_02", "p": "Seaver King", "team": "Nationals", "pr": 1.21, "rc": true, "legend": false, "style": "Donruss", "img": "donruss2_imgs/888_02.jpg"}, {"k": "887_05", "p": "Trey Yesavage", "team": "Blue Jays", "pr": 1.19, "rc": true, "legend": false, "style": "Donruss", "img": "donruss2_imgs/887_05.jpg"}, {"k": "887_08", "p": "Paul Skenes", "team": "Pirates", "pr": 1.11, "rc": false, "legend": false, "style": "Donruss", "img": "donruss2_imgs/887_08.jpg"}, {"k": "887_04", "p": "Reggie Jackson", "team": "Yankees", "pr": 0.99, "rc": false, "legend": true, "style": "Donruss", "img": "donruss2_imgs/887_04.jpg"}, {"k": "888_07", "p": "Albert Pujols", "team": "Cardinals", "pr": 0.99, "rc": false, "legend": true, "style": "Donruss", "img": "donruss2_imgs/888_07.jpg"}, {"k": "888_09", "p": "Jim Thome", "team": "Guardians", "pr": 0.99, "rc": false, "legend": true, "style": "Donruss Optic", "img": "donruss2_imgs/888_09.jpg"}];
const TOTAL = DATA.reduce((s,r)=>s+r.pr,0);
document.getElementById("stats").textContent = `${DATA.length} cards · $${TOTAL.toFixed(2)} total value`;
let activeFilter = "";
const list = document.getElementById("list"), chips = document.getElementById("chips");
function renderChips(){
  chips.innerHTML = "";
  const mk = (label, pred) => {
    const n = DATA.filter(pred).length;
    const b = document.createElement("button");
    b.className = "chip" + (activeFilter === label ? " on" : "");
    b.textContent = `${label} (${n})`;
    b.onclick = () => { activeFilter = (activeFilter === label) ? "" : label; renderChips(); render(); };
    chips.appendChild(b);
  };
  mk("All", () => true);
  mk("Rookies", r => r.rc);
  mk("Legends", r => r.legend);
}
function passesFilter(r){
  if (activeFilter === "Rookies") return r.rc;
  if (activeFilter === "Legends") return r.legend;
  return true;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase();
  list.innerHTML = "";
  for (const r of DATA){
    if (!passesFilter(r)) continue;
    if (q && !((r.p + " " + r.team).toLowerCase().includes(q))) continue;
    const el = document.createElement("div");
    el.className = "card";
    const badges = (r.rc?'<span class="badge b-rc">RC</span>':'') +
                   (r.legend?'<span class="badge b-leg">LEGEND</span>':'');
    el.innerHTML = (r.img ? `<img class="th" loading="lazy" src="${r.img}">` : `<div class="th"></div>`) +
      `<div class="info"><div class="nm">${badges}${r.p}</div><div class="tm">${r.team}</div><div class="st">${r.style}</div></div>` +
      `<div class="pr">$${r.pr.toFixed(2)}</div>`;
    const img = el.querySelector("img.th");
    if (img) img.onclick = () => { document.getElementById("lbimg").src = r.img; document.getElementById("lightbox").classList.add("on"); };
    list.appendChild(el);
  }
}
document.getElementById("lightbox").onclick = () => document.getElementById("lightbox").classList.remove("on");
document.getElementById("q").oninput = render;
renderChips(); render();
</script></body></html>
