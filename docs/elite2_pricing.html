<title>2025 Donruss Elite Baseball (Batch 2) - Valuation Reference</title>
<style>
 body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#f4f6f9;color:#111}
 .wrap{max-width:820px;margin:0 auto;padding:16px 14px 40px}
 h1{font-size:22px;margin:6px 0 2px}
 .sub{color:#667;font-size:13.5px;margin:0 0 10px;line-height:1.4}
 .sub a{color:#246}
 #chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
 .chip{flex:0 0 auto;font-size:13px;font-weight:600;padding:7px 12px;border-radius:20px;border:1.5px solid #bcd;
       background:#fff;color:#345;cursor:pointer;white-space:nowrap}
 .chip.on{background:#123;color:#fff;border-color:#123}
 #q{width:100%;box-sizing:border-box;font-size:17px;padding:11px 13px;border:1px solid #ccd;border-radius:12px;margin:8px 0 10px}
 .card{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dde;border-radius:12px;
       padding:9px 11px;margin:6px 0}
 img.th{width:48px;height:64px;object-fit:cover;border-radius:6px;background:#eee;flex:0 0 48px;cursor:zoom-in}
 .info{flex:1;min-width:0}
 .nm{font-weight:650;font-size:14.5px;line-height:1.25}
 .tm{color:#667;font-size:12px}
 .st{color:#99a;font-size:11px;margin-top:2px}
 .badge{display:inline-block;font-size:9.5px;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:4px;vertical-align:1px}
 .b-rc{background:#123;color:#fff}
 .b-leg{background:#7a2e8f;color:#fff}
 .b-ser{background:#c0392b;color:#fff}
 .pr{flex:0 0 auto;font-weight:700;color:#1a5c1a;font-size:15px}
 #stats{position:sticky;top:0;background:#f4f6f9;padding:6px 0;font-size:12.5px;color:#556;border-bottom:1px solid #dde;margin-bottom:6px}
 #lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;align-items:center;justify-content:center}
 #lightbox.on{display:flex}
 #lightbox img{max-width:92vw;max-height:88vh;border-radius:10px}
</style></head><body><div class="wrap">
<h1>2025 Donruss Elite Baseball (Batch 2)</h1>
<p class="sub">24 cards from packs opened 2026-08-10, priced against real PriceCharting comps where they exist. Top value $9.00 (Bobby Witt Jr., estimated -- no sales data yet on that exact insert). The <a href="elite2_pull.html">pull list</a> has the $5+ ones. Tap image to zoom.</p>
<div id="stats"></div>
<div id="chips"></div>
<input id="q" type="search" placeholder="Search player, team...">
<div id="list"></div>
</div>
<div id="lightbox"><img id="lbimg" src=""></div>
<script>
const DATA = [{"k": "899_05", "p": "Bobby Witt Jr.", "team": "Royals", "pr": 9.0, "rc": false, "legend": false, "serial": "183/299", "style": "Donruss Elite Green Stars", "img": "elite2_imgs/899_05.jpg"}, {"k": "898_04", "p": "Roger Clemens", "team": "Red Sox", "pr": 5.5, "rc": false, "legend": true, "serial": null, "style": "Donruss Elite Dominators", "img": "elite2_imgs/898_04.jpg"}, {"k": "897_07", "p": "Ethan Holliday", "team": "Rockies", "pr": 4.35, "rc": true, "legend": false, "serial": null, "style": "Donruss Elite Spell Bound", "img": "elite2_imgs/897_07.jpg"}, {"k": "898_05", "p": "Josh Hamilton", "team": "Rangers", "pr": 3.49, "rc": false, "legend": true, "serial": null, "style": "Donruss Elite Career Best", "img": "elite2_imgs/898_05.jpg"}, {"k": "897_04", "p": "Jimmy Crooks", "team": "Cardinals", "pr": 3.25, "rc": true, "legend": false, "serial": null, "style": "Donruss Elite Green", "img": "elite2_imgs/897_04.jpg"}, {"k": "899_01", "p": "Eli Willits", "team": "Nationals", "pr": 3.12, "rc": true, "legend": false, "serial": null, "style": "Donruss Elite Spell Bound", "img": "elite2_imgs/899_01.jpg"}, {"k": "899_04", "p": "Wade Boggs", "team": "Red Sox", "pr": 2.5, "rc": false, "legend": true, "serial": null, "style": "Donruss Elite", "img": "elite2_imgs/899_04.jpg"}, {"k": "897_02", "p": "Andruw Jones", "team": "Braves", "pr": 2.5, "rc": false, "legend": true, "serial": null, "style": "Donruss Elite", "img": "elite2_imgs/897_02.jpg"}, {"k": "898_01", "p": "George Brett", "team": "Royals", "pr": 2.5, "rc": false, "legend": true, "serial": null, "style": "Donruss Elite Green", "img": "elite2_imgs/898_01.jpg"}, {"k": "898_08", "p": "Mike Piazza", "team": "Mets", "pr": 2.5, "rc": false, "legend": true, "serial": null, "style": "Donruss Elite", "img": "elite2_imgs/898_08.jpg"}, {"k": "899_06", "p": "Jose Canseco", "team": "Athletics", "pr": 2.07, "rc": false, "legend": true, "serial": null, "style": "Donruss Elite", "img": "elite2_imgs/899_06.jpg"}, {"k": "899_02", "p": "Tommy White", "team": "Athletics", "pr": 1.89, "rc": true, "legend": false, "serial": null, "style": "Donruss Elite", "img": "elite2_imgs/899_02.jpg"}, {"k": "897_05", "p": "Jordan Yost", "team": "Tigers", "pr": 1.75, "rc": true, "legend": false, "serial": null, "style": "Donruss Elite", "img": "elite2_imgs/897_05.jpg"}, {"k": "897_08", "p": "Dax Kilby", "team": "Mets", "pr": 1.75, "rc": true, "legend": false, "serial": null, "style": "Donruss Elite", "img": "elite2_imgs/897_08.jpg"}, {"k": "897_09", "p": "Josuar Gonzalez", "team": "Giants", "pr": 1.75, "rc": true, "legend": false, "serial": null, "style": "Donruss Elite", "img": "elite2_imgs/897_09.jpg"}, {"k": "898_06", "p": "JoJo Parker", "team": "Blue Jays", "pr": 1.75, "rc": true, "legend": false, "serial": null, "style": "Donruss Elite", "img": "elite2_imgs/898_06.jpg"}, {"k": "898_09", "p": "Chase Burns", "team": "Reds", "pr": 1.75, "rc": true, "legend": false, "serial": null, "style": "Donruss Elite Green", "img": "elite2_imgs/898_09.jpg"}, {"k": "898_07", "p": "Steve Carlton", "team": "Phillies", "pr": 1.59, "rc": false, "legend": true, "serial": null, "style": "Donruss Elite", "img": "elite2_imgs/898_07.jpg"}, {"k": "897_01", "p": "Daniel Pierce", "team": "Rays", "pr": 1.57, "rc": true, "legend": false, "serial": null, "style": "Donruss Elite", "img": "elite2_imgs/897_01.jpg"}, {"k": "897_06", "p": "Yadier Molina", "team": "Cardinals", "pr": 1.45, "rc": false, "legend": true, "serial": null, "style": "Donruss Elite", "img": "elite2_imgs/897_06.jpg"}, {"k": "899_03", "p": "James Wood", "team": "Nationals", "pr": 1.3, "rc": false, "legend": false, "serial": null, "style": "Donruss Elite", "img": "elite2_imgs/899_03.jpg"}, {"k": "897_03", "p": "Rod Carew", "team": "Twins", "pr": 1.18, "rc": false, "legend": true, "serial": null, "style": "Donruss Elite", "img": "elite2_imgs/897_03.jpg"}, {"k": "898_03", "p": "Rhett Lowder", "team": "Reds", "pr": 1.12, "rc": true, "legend": false, "serial": null, "style": "Donruss Elite", "img": "elite2_imgs/898_03.jpg"}, {"k": "898_02", "p": "Rainiel Rodriguez", "team": "Cardinals", "pr": 1.0, "rc": true, "legend": false, "serial": null, "style": "Donruss Elite", "img": "elite2_imgs/898_02.jpg"}];
const TOTAL = DATA.reduce((s,r)=>s+r.pr,0);
document.getElementById("stats").textContent = `${DATA.length} cards · $${TOTAL.toFixed(2)} total value`;
let activeFilter = "";
const list = document.getElementById("list"), chips = document.getElementById("chips");
function renderChips(){
  chips.innerHTML = "";
  const mk = (label, pred) => {
    const n = DATA.filter(pred).length;
    const b = document.createElement("button");
    b.className = "chip" + (activeFilter === label ? " on" : "");
    b.textContent = `${label} (${n})`;
    b.onclick = () => { activeFilter = (activeFilter === label) ? "" : label; renderChips(); render(); };
    chips.appendChild(b);
  };
  mk("All", () => true);
  mk("$5+", r => r.pr >= 5);
  mk("Rookies", r => r.rc);
  mk("Legends", r => r.legend);
  mk("Serial #'d", r => r.serial);
}
function passesFilter(r){
  if (activeFilter === "$5+") return r.pr >= 5;
  if (activeFilter === "Rookies") return r.rc;
  if (activeFilter === "Legends") return r.legend;
  if (activeFilter === "Serial #'d") return !!r.serial;
  return true;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase();
  list.innerHTML = "";
  for (const r of DATA){
    if (!passesFilter(r)) continue;
    if (q && !((r.p + " " + r.team).toLowerCase().includes(q))) continue;
    const el = document.createElement("div");
    el.className = "card";
    const badges = (r.rc?'<span class="badge b-rc">RC</span>':'') +
                   (r.legend?'<span class="badge b-leg">LEGEND</span>':'') +
                   (r.serial?`<span class="badge b-ser">${r.serial}</span>`:'');
    el.innerHTML = (r.img ? `<img class="th" loading="lazy" src="${r.img}">` : `<div class="th"></div>`) +
      `<div class="info"><div class="nm">${badges}${r.p}</div><div class="tm">${r.team}</div><div class="st">${r.style}</div></div>` +
      `<div class="pr">$${r.pr.toFixed(2)}</div>`;
    const img = el.querySelector("img.th");
    if (img) img.onclick = () => { document.getElementById("lbimg").src = r.img; document.getElementById("lightbox").classList.add("on"); };
    list.appendChild(el);
  }
}
document.getElementById("lightbox").onclick = () => document.getElementById("lightbox").classList.remove("on");
document.getElementById("q").oninput = render;
renderChips(); render();
</script></body></html>
